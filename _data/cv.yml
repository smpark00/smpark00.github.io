- title: Research Interests
  type: text
  contents:
    - Large Language Models — retrieval-augmented generation, domain-specific fine-tuning, and agent-based pipelines — and their application to healthcare and biomedical data. Across five first-author papers and industry research spanning clinical LLMs and single-cell transcriptomics, I aim to build language-model systems that turn domain knowledge into reliable, real-world decision support.

